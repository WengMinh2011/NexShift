name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NexShift debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not configured on runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part-*.b64 > NexShift-source.tar.xz.b64
          test "$(wc -c < NexShift-source.tar.xz.b64)" -eq 40808
          base64 --decode NexShift-source.tar.xz.b64 > NexShift-source.tar.xz
          echo "b701cdea6206154f00032b04f722926f3ed2157ac705a6d5709377908abf71d3  NexShift-source.tar.xz" | sha256sum --check
          tar -xJf NexShift-source.tar.xz
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/NexShift-v1.0.1-debug.apk
          sha256sum dist/NexShift-v1.0.1-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexShift-v1.0.1-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
